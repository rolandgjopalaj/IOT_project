<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Controllo Accesso Porta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
:root {
  --primary: #76b6ff;
  --primary-light: #e6f3ff;
  --success: #63b07c;
  --error: #eb4764;
  --bg-gradient: linear-gradient(135deg, #f6fcfe 0%, #eaf6ff 100%);
  --bg-card: rgba(255,255,255,0.84);
  --card-shadow: 0 10px 32px 0 rgba(100,130,200,0.12);
  --border: #dde6ee;
  --accent: #b9e0ff;
  --highlight: #eaf6ff;
  --heading: #26466b;
  --text: #3c5878;
  --placeh: #98b5da;
  --highlight-dark: #273f5b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --primary: #93cfff;
    --primary-light: #182c48;
    --success: #6ce5b1;
    --error: #ff6c82;
    --bg-gradient: linear-gradient(135deg, #162336 0%, #20445c 100%);
    --bg-card: rgba(34,45,62,0.93);
    --card-shadow: 0 10px 32px 0 rgba(30,50,90,0.25);
    --border: #294969;
    --accent: #265485;
    --highlight: #233349;
    --heading: #cce0f4;
    --text: #bcd1e7;
    --placeh: #7995b6;
    --highlight-dark: #466bac;
  }
  body { color-scheme: dark; }
}

html, body {
  min-height: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}
body {
  background: var(--bg-gradient);
  font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-size: 19px;
  overflow: hidden;
  transition: background 0.8s;
  opacity: 0;
  transition: opacity 1.1s cubic-bezier(.48,.13,.19,1.04);
}
body.loaded { opacity: 1; }

.bg-illust {
  position: fixed;
  z-index: 0;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
}
.bg-illust svg {
  width: 100vw;
  height: 100vh;
  display: block;
}

.login-card {
  background: var(--bg-card);
  border-radius: 1.6rem;
  padding: 2.7rem 2.1rem 2.1rem 2.1rem;
  box-shadow: var(--card-shadow);
  width: 100%;
  max-width: 370px;
  border: 1.2px solid var(--border);
  backdrop-filter: blur(17px) saturate(165%);
  transition: box-shadow 0.3s, transform 0.3s;
  text-align: center;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  overflow: hidden;
  animation: fadeUp .7s cubic-bezier(.57,.13,.19,1.04);
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(35px);}
  to   { opacity:1; transform:translateY(0);}
}
.login-card.shake {
  animation: shake 0.35s;
}
@keyframes shake {
  0% { transform: translateX(0);}
  15% { transform: translateX(-9px);}
  35% { transform: translateX(7px);}
  60% { transform: translateX(-6px);}
  80% { transform: translateX(4px);}
  100%{ transform: translateX(0);}
}

.illustration {
  margin-bottom: 1.1rem;
  display: flex;
  justify-content: center;
}
.illustration svg {
  width: 56px;
  height: 56px;
  display: block;
  filter: drop-shadow(0 1px 9px #bdecff77);
}

h1 {
  color: var(--heading);
  font-weight: 800;
  font-size: 2.1rem;
  margin-bottom: 0.4rem;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 12px #fff2;
  transition: color 0.2s;
}

.welcome {
  color: var(--placeh);
  margin-bottom: 2.1rem;
  font-size: 1.04rem;
  font-weight: 500;
  letter-spacing: 0;
}

.form-group {
  margin-bottom: 1.2rem;
  position: relative;
}

input {
  width: 90%;
  padding: 1.1rem 1rem;
  border: 1.6px solid var(--border);
  border-radius: 0.8rem;
  font-size: 1.07rem;
  background: var(--primary-light);
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s, background 0.18s;
  box-shadow: 0 1px 5px 0 rgba(150,180,205,0.03);
  font-family: inherit;
  outline: none;
}
input::placeholder {
  color: var(--placeh);
  opacity: 1;
}
.icon-left {
  position: absolute;
  left: 90%;
  top: 50%;
  transform: translateY(-50%);
  color: var(--placeh);
  font-size: 1.24rem;
  pointer-events: none;
}

button {
  width: 100%;
  padding: 1.03rem;
  background: linear-gradient(90deg, var(--primary) 60%, #bde6fd 100%);
  color: #234;
  border: none;
  border-radius: 0.8rem;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(126,180,255,0.09);
  transition: background 0.22s, box-shadow 0.22s, opacity 0.26s, color 0.18s;
  outline: none;
}
button:hover, button:focus {
  background: linear-gradient(90deg, #c1e7ff 80%, #7fe1fc 100%);
  color: #204060;
  box-shadow: 0 8px 26px 0 rgba(140,200,255,0.17);
  opacity: 0.99;
}

.loading {
  position: relative;
  pointer-events: none;
  opacity: 0.75;
}
.loading::after {
  content: "";
  position: absolute;
  right: 1.5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1.18rem;
  height: 1.18rem;
  border: 2.5px solid #e6f4fd;
  border-top-color: #84caff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: translateY(-50%) rotate(360deg); }
}

.message {
  padding: 1rem 1.3rem;
  margin-top: 1.08rem;
  margin-bottom: 0.25rem;
  text-align: center;
  display: none;
  font-size: 1.03rem;
  font-weight: 500;
  z-index: 1;
}

.success {
  color: #5cb85c;
}
.error {
  color: #FF0000;
}

#countdown {
  color: #5cb85c;
  font-size: 0.99em;
  margin-left: 0.6em;
}

._link {
  margin-top: 1.7rem;
  font-size: 0.99em;
}
a {
  color: #2e88bf;
  text-decoration: none;
  position: relative;
  padding-bottom: 2.5px;
  transition: color 0.2s;
}
a::after {
  content: '';
  display: block;
  width: 0;
  height: 2.5px;
  background: #5daaff;
  transition: width 0.22s;
  position: absolute;
  left: 0;
  bottom: 0;
  border-radius: 1.3px;
}
a:hover,
a:focus {
  color: #1678b9;
}
a:hover::after,
a:focus::after {
  width: 100%;
}

/* Scrollbar soft */
::-webkit-scrollbar { width: 10px; background: #dde9f6;}
::-webkit-scrollbar-thumb { background: #b5d6f8; border-radius: 7px;}

@media (max-width: 500px) {
  .login-card {
    max-width: 96vw;
    padding: 1.5rem 4vw 1.1rem 4vw;
  }
  .illustration svg { width:40px; height:40px;}
}
  </style>
</head>
<body>
  <div class="bg-illust" aria-hidden="true">
    <svg viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="380" cy="150" rx="270" ry="116" fill="#b7e5ff" opacity=".18"/>
      <ellipse cx="1280" cy="300" rx="260" ry="110" fill="#c6eaff" opacity=".12"/>
      <ellipse cx="420" cy="860" rx="220" ry="70" fill="#b1c8ef" opacity=".12"/>
    </svg>
  </div>
  <div class="login-card">
    <div class="illustration">
      <!-- Keyhole icon SVG -->
      <svg viewBox="0 0 58 58" fill="none">
        <circle cx="29" cy="29" r="28" fill="#c9e8ff"/>
        <rect x="16" y="28" width="26" height="18" rx="6" fill="#73bbf9"/>
        <rect x="24" y="20" width="10" height="16" rx="5" fill="#a4d5ff"/>
        <circle cx="29" cy="37" r="3" fill="#308ee6"/>
      </svg>
    </div>
    <h1>Controllo Accesso</h1>
    <div class="welcome">Benvenuto! Solo personale autorizzato.</div>
    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <span class="icon-left">&#128100;</span>
        <input type="text" id="utente" placeholder="Nome operatore" autocomplete="off" required>
      </div>
      <div class="form-group">
        <span class="icon-left">&#128272;</span>
        <input type="password" id="password" placeholder="Parola d'ordine" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <button type="submit">Accedi</button>
      </div>
    </form>
    <div id="message" class="message">
      <span id="msgText"></span>
      <span id="countdown" style="display:none; margin-left: 0.5em;"></span>
    </div>
    <div class="_link">
      <a href="/accessi">&rarr; Log di accessi &rarr;</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{ document.body.classList.add('loaded'); });

    const form = document.getElementById('loginForm');
    const messageDiv = document.getElementById('message');
    const msgText = document.getElementById('msgText');
    const countdownSpan = document.getElementById('countdown');
    const card = document.querySelector('.login-card');
    let countdownInterval = null;

    function hash(password) {
      return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const button = form.querySelector('button');
      button.classList.add('loading');
      messageDiv.style.display = 'none';
      countdownSpan.style.display = 'none';
      clearInterval(countdownInterval);

      const utente = document.getElementById('utente').value;
      const pwdIn = document.getElementById('password').value;

      const payload = {
        utente: utente,
        parola_dordine: hash(pwdIn)
      };
      document.getElementById('utente').value = ""
      document.getElementById('password').value = ""

      try {
        const response = await fetch('/apri', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        const result = await response.text();

        const ok = result.includes('Consentito');
        messageDiv.className = 'message ' + (ok ? 'success' : 'error');
        msgText.textContent = result;
        messageDiv.style.display = 'block';

        if(ok) {
          let seconds = 5;
          countdownSpan.textContent = `(${seconds}s)`;
          countdownSpan.style.display = 'inline';
          countdownInterval = setInterval(() => {
            seconds--;
            countdownSpan.textContent = `(${seconds}s)`;
            if(seconds <= 0) {
              clearInterval(countdownInterval);
              messageDiv.style.display = 'none';
              countdownSpan.style.display = 'none';
            }
          }, 1000);
        } else {
          countdownSpan.style.display = 'none';
          card.classList.add('shake');
          setTimeout(()=>card.classList.remove('shake'),370);
        }
      } catch (error) {
        messageDiv.className = 'message error';
        msgText.textContent = 'Errore di connessione';
        messageDiv.style.display = 'block';
        countdownSpan.style.display = 'none';
        card.classList.add('shake');
        setTimeout(()=>card.classList.remove('shake'),370);
      } finally {
        button.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
