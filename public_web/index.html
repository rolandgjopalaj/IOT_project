<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Controllo Accesso Porta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
:root {
    --primary: #0071e3;
    --success: #34c759;
    --error: #ff3b30;
    --bg: #f5f5f7;
    --card-bg: rgba(255,255,255,0.85);
    --border: #e5e5ea;
    --shadow: 0 8px 32px rgba(0,0,0,0.12);
}

body {
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.login-card {
    background: var(--card-bg);
    padding: 2.5rem 2rem;
    border-radius: 1.5rem;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 380px;
    border: 1px solid var(--border);
    backdrop-filter: blur(16px) saturate(180%);
    transition: box-shadow 0.3s, transform 0.3s;
    text-align: center;
}

.login-card:hover {
    box-shadow: 0 16px 40px rgba(0,0,0,0.18);
    transform: translateY(-3px) scale(1.012);
}

h1 {
    color: #1d1d1f;
    text-align: center;
    margin-bottom: 2.2rem;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
}

.form-group {
    margin-bottom: 1.6rem;
}

input {
    width: 90%;
    padding: 1.1rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 0.75rem;
    font-size: 1.08rem;
    background: rgba(245,245,247,0.7);
    color: #1d1d1f;
    transition: border-color 0.2s, box-shadow 0.2s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}

input:focus {
    border-color: #0d0d0d;
    outline: none;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,113,227,0.06);
}

button {
    width: 100%;
    padding: 1rem;
    background: #0d0d0d;
    color: #fff;
    border: none;
    border-radius: 0.75rem;
    font-size: 1.12rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, opacity 0.3s;
    box-shadow: 0 2px 8px rgba(0,113,227,0.09);
    letter-spacing: 0.01em;
}

button:hover, button:focus {
    background: #0d0d0d;
    opacity: 0.98;
    box-shadow: 0 4px 16px rgba(0,113,227,0.13);
}

.loading {
    position: relative;
    pointer-events: none;
    opacity: 0.7;
}

.loading::after {
    content: "";
    position: absolute;
    right: 1.3rem;
    top: 50%;
    transform: translateY(-50%);
    width: 1.25rem;
    height: 1.25rem;
    border: 3px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: translateY(-50%) rotate(360deg); }
}

.message {
    padding: 1.1rem;
    border-radius: 0.75rem;
    margin-top: 1.2rem;
    text-align: center;
    display: none;
    font-size: 1.04rem;
    font-weight: 500;
    border: 1.5px solid transparent;
    background: rgba(245,245,247,0.7);
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}

.success {
    background: #f4fff7;
    color: var(--success);
    border-color: var(--success);
}

.error {
    background: #fff6f6;
    color: var(--error);
    border-color: var(--error);
}

#countdown {
    color: #86868b;
    font-size: 0.98em;
    margin-left: 0.5em;
}

a {
  color: #1a1a1a;
  text-decoration: none;
  position: relative;
  padding-bottom: 2px;
  transition: color 0.2s;
}

a::after {
  content: '';
  display: block;
  width: 0;
  height: 2px;
  background: #0077ff;
  transition: width 0.2s;
  position: absolute;
  left: 0;
  bottom: 0;
}

a:hover,
a:focus {
  color: #0077ff;
}

a:hover::after,
a:focus::after {
  width: 100%;
}


    </style>
</head>
<body>
    <div class="login-card">
        <h1>Controllo Accesso</h1>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" 
                       id="utente" 
                       placeholder="Nome operatore"
                       autocomplete="off">
            </div>
            <div class="form-group">
                <input type="password" 
                       id="password" 
                       placeholder="Parola d'ordine"
                       required
                       autocomplete="current-password">
            </div>
            <div class="form-group">
              <button type="submit">Accedi</button>
            </div>
            
        </form>
        <div id="message" class="message">
            <span id="msgText"></span>
            <span id="countdown" style="display:none; margin-left: 0.5em;"></span>
        </div>

        <div class="_link">
            <a href="/accessi"> &rarr; Log di accessi &rarr;</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
    <script>
      const form = document.getElementById('loginForm');
      const messageDiv = document.getElementById('message');
      const msgText = document.getElementById('msgText');
      const countdownSpan = document.getElementById('countdown');
      let countdownInterval = null;

      //encrypt password
      function hash(password) {
        return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
        }

  
      form.addEventListener('submit', async (e) => {
          e.preventDefault();
  
          const button = form.querySelector('button');
          button.classList.add('loading');
          messageDiv.style.display = 'none';
          countdownSpan.style.display = 'none';
          clearInterval(countdownInterval);
  
          const payload = {
              utente: document.getElementById('utente').value,
              parola_dordine: hash(document.getElementById('password').value)
          };

          //back to blank
          document.getElementById('utente').value = ""
          parola_dordine: document.getElementById('password').value = ""
  
          try {
              const response = await fetch('/apri', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(payload)
              });
  
              const result = await response.text();
  
              messageDiv.className = 'message ' +
                  (result.includes('Consentito') ? 'success' : 'error');
              msgText.textContent = result;
              messageDiv.style.display = 'block';
  
              if(result.includes('Consentito')) {
                  let seconds = 5;
                  countdownSpan.textContent = `(${seconds}s)`;
                  countdownSpan.style.display = 'inline';
                  countdownInterval = setInterval(() => {
                      seconds--;
                      countdownSpan.textContent = `(${seconds}s)`;
                      if(seconds <= 0) {
                          clearInterval(countdownInterval);
                          messageDiv.style.display = 'none';
                          countdownSpan.style.display = 'none';
                      }
                  }, 1000);
              } else {
                  countdownSpan.style.display = 'none';
              }
  
          } catch (error) {
              messageDiv.className = 'message error';
              msgText.textContent = 'Errore di connessione';
              messageDiv.style.display = 'block';
              countdownSpan.style.display = 'none';
          } finally {
              button.classList.remove('loading');
          }
      });
  </script>
  
</body>
</html>
