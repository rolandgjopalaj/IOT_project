<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Visualizza Log Accessi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
:root {
  --primary: #76b6ff;
  --primary-light: #e6f3ff;
  --success: #63b07c;
  --error: #eb4764;
  --bg-gradient: linear-gradient(135deg, #f6fcfe 0%, #eaf6ff 100%);
  --bg-card: rgba(255,255,255,0.84);
  --card-shadow: 0 10px 32px 0 rgba(100,130,200,0.12);
  --border: #dde6ee;
  --accent: #b9e0ff;
  --highlight: #eaf6ff;
  --heading: #26466b;
  --text: #3c5878;
  --placeh: #98b5da;
  --highlight-dark: #273f5b;
}

@media (prefers-color-scheme: dark) {
  :root {
    --primary: #93cfff;
    --primary-light: #182c48;
    --success: #6ce5b1;
    --error: #ff6c82;
    --bg-gradient: linear-gradient(135deg, #162336 0%, #20445c 100%);
    --bg-card: rgba(34,45,62,0.93);
    --card-shadow: 0 10px 32px 0 rgba(30,50,90,0.25);
    --border: #294969;
    --accent: #265485;
    --highlight: #233349;
    --heading: #cce0f4;
    --text: #bcd1e7;
    --placeh: #7995b6;
    --highlight-dark: #466bac;
  }
  body { color-scheme: dark; }
}

html, body {
  min-height: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}
body {
  background: var(--bg-gradient);
  font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-size: 19px;
  overflow: hidden;
  transition: background 0.8s;
  opacity: 0;
  transition: opacity 1.1s cubic-bezier(.48,.13,.19,1.04);
}
body.loaded { opacity: 1; }

.bg-illust {
  position: fixed;
  z-index: 0;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
}
.bg-illust svg {
  width: 100vw;
  height: 100vh;
  display: block;
}

.login-card {
  background: var(--bg-card);
  border-radius: 1.6rem;
  padding: 2.4rem 2.1rem 2.1rem 2.1rem;
  box-shadow: var(--card-shadow);
  width: 100%;
  max-width: 440px;
  border: 1.2px solid var(--border);
  backdrop-filter: blur(17px) saturate(165%);
  transition: box-shadow 0.3s, transform 0.3s;
  text-align: center;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  overflow: hidden;
  animation: fadeUp .7s cubic-bezier(.57,.13,.19,1.04);
}
@keyframes fadeUp {
  from { opacity:0; transform:translateY(35px);}
  to   { opacity:1; transform:translateY(0);}
}

.illustration {
  margin-bottom: 1.1rem;
  display: flex;
  justify-content: center;
}
.illustration svg {
  width: 54px;
  height: 54px;
  display: block;
  filter: drop-shadow(0 1px 9px #bdecff77);
}

h1 {
  color: var(--heading);
  font-weight: 800;
  font-size: 2.05rem;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 12px #fff2;
  transition: color 0.2s;
}

.form-group {
  margin-bottom: 1.2rem;
  position: relative;
}

input {
  width: 90%;
  padding: 1.1rem 1rem;
  border: 1.6px solid var(--border);
  border-radius: 0.8rem;
  font-size: 1.07rem;
  background: var(--primary-light);
  color: var(--text);
  transition: border-color 0.2s, box-shadow 0.2s, background 0.18s;
  box-shadow: 0 1px 5px 0 rgba(150,180,205,0.03);
  font-family: inherit;
  outline: none;
}
input:focus {
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 4px 14px rgba(120,180,255,0.11);
}
input::placeholder {
  color: var(--placeh);
  opacity: 1;
}
.icon-left {
  position: absolute;
  left: 0.7rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--placeh);
  font-size: 1.24rem;
  pointer-events: none;
}

button {
  width: 100%;
  padding: 1.03rem;
  background: linear-gradient(90deg, var(--primary) 60%, #bde6fd 100%);
  color: #234;
  border: none;
  border-radius: 0.8rem;
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(126,180,255,0.09);
  transition: background 0.22s, box-shadow 0.22s, opacity 0.26s, color 0.18s;
  outline: none;
}
button:hover, button:focus {
  background: linear-gradient(90deg, #c1e7ff 80%, #7fe1fc 100%);
  color: #204060;
  box-shadow: 0 8px 26px 0 rgba(140,200,255,0.17);
  opacity: 0.99;
}
.loading {
  position: relative;
  pointer-events: none;
  opacity: 0.75;
}
.loading::after {
  content: "";
  position: absolute;
  right: 1.5rem;
  top: 50%;
  transform: translateY(-50%);
  width: 1.18rem;
  height: 1.18rem;
  border: 2.5px solid #e6f4fd;
  border-top-color: #84caff;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: translateY(-50%) rotate(360deg); }
}

.message {
  padding: 1rem 1.3rem;
  border-radius: 0.78rem;
  margin-top: 1.08rem;
  margin-bottom: 0.25rem;
  text-align: center;
  display: none;
  font-size: 1.03rem;
  font-weight: 500;
  border: 1.5px solid transparent;
  background: var(--highlight);
  box-shadow: 0 1px 4px rgba(50,90,160,0.04);
  z-index: 1;
  word-break: break-word;
}
.success {
  background: #e8fff2;
  color: var(--success);
  border-color: #c7fadc;
}
.error {
  background: #fff2f6;
  color: var(--error);
  border-color: #ffd6df;
}

#logs {
  margin-top: 1.5rem;
  text-align: left;
  background: var(--highlight);
  border: 1.5px solid var(--border);
  border-radius: 0.75rem;
  padding: 1.2rem 1rem;
  font-size: 1.02rem;
  color: var(--heading);
  white-space: pre-wrap;
  max-height: 350px;
  overflow-y: auto;
  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
  display: none;
}

._link {
  margin-bottom: 0.6rem;
  text-align: left;
}
a {
  color: #2e88bf;
  text-decoration: none;
  position: relative;
  padding-bottom: 2.5px;
  transition: color 0.2s;
  font-size: 1rem;
}
a::after {
  content: '';
  display: block;
  width: 0;
  height: 2.5px;
  background: #5daaff;
  transition: width 0.22s;
  position: absolute;
  left: 0;
  bottom: 0;
  border-radius: 1.3px;
}
a:hover,
a:focus {
  color: #1678b9;
}
a:hover::after,
a:focus::after {
  width: 100%;
}
::-webkit-scrollbar { width: 10px; background: #dde9f6;}
::-webkit-scrollbar-thumb { background: #b5d6f8; border-radius: 7px;}
@media (max-width: 500px) {
  .login-card {
    max-width: 97vw;
    padding: 1.25rem 4vw 1.2rem 4vw;
  }
  .illustration svg { width:37px; height:37px;}
}
  </style>
</head>
<body>
  <div class="bg-illust" aria-hidden="true">
    <svg viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="380" cy="150" rx="270" ry="116" fill="#b7e5ff" opacity=".18"/>
      <ellipse cx="1280" cy="300" rx="260" ry="110" fill="#c6eaff" opacity=".12"/>
      <ellipse cx="420" cy="860" rx="220" ry="70" fill="#b1c8ef" opacity=".12"/>
    </svg>
  </div>
  <div class="login-card">
    <div class="_link">
      <a href="/">&larr; Indietro (Porta)</a>
    </div>

    <div class="illustration" style="margin-bottom:0.6rem;">
      <!-- Log / Document SVG icon -->
      <svg viewBox="0 0 58 58" fill="none">
        <rect x="7" y="11" width="44" height="36" rx="7" fill="#b1def7"/>
        <rect x="16" y="20" width="26" height="2.6" rx="1.2" fill="#61b7fc"/>
        <rect x="16" y="27" width="19" height="2.4" rx="1.1" fill="#94cdfa"/>
        <rect x="16" y="34" width="13" height="2.2" rx="1" fill="#d5edff"/>
        <rect x="16" y="41" width="8" height="2" rx="1" fill="#e0f4ff"/>
        <rect x="34" y="34" width="8" height="8" rx="2" fill="#73bbf9"/>
        <rect x="37" y="37" width="2" height="2" rx="1" fill="#fff"/>
      </svg>
    </div>

    <h1>Visualizza Log Accessi</h1>
    <form id="accessiForm" autocomplete="off">
      <div class="form-group">
        <span class="icon-left">&#128272;</span>
        <input type="password" 
               id="parola_dordine" 
               placeholder="&nbsp;&nbsp;&nbsp;&nbsp;Parola d'ordine"
               required
               autocomplete="current-password">
      </div>
      <div class="form-group">
        <button type="submit">Visualizza</button>
      </div>
    </form>
    <div id="message" class="message error"></div>
    <div id="logs"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded',()=>{ document.body.classList.add('loaded'); });

    const form = document.getElementById('accessiForm');
    const messageDiv = document.getElementById('message');
    const logsDiv = document.getElementById('logs');
    const button = form.querySelector('button');
    const card = document.querySelector('.login-card');

    //encrypt password
    function hash(password) {
      return CryptoJS.SHA256(password).toString(CryptoJS.enc.Hex);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.style.display = 'none';
      logsDiv.style.display = 'none';
      button.classList.add('loading');

      const password = document.getElementById('parola_dordine').value;
      const hashedPassword =hash(password);

      try {
          const response = await fetch('/accessi', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ parola_dordine: hashedPassword })
          });

          const text = await response.text();

          if (response.ok) {
              logsDiv.innerHTML = text.replace(/\n/g, "<br><br>");
              logsDiv.style.display = 'block';
              messageDiv.style.display = 'none';
          } else {
              messageDiv.textContent = text || 'Password errata o errore server.';
              messageDiv.className = 'message error';
              messageDiv.style.display = 'block';
              logsDiv.style.display = 'none';
              card.classList.add('shake');
              setTimeout(()=>card.classList.remove('shake'),370);
          }
      } catch (err) {
          messageDiv.textContent = 'Errore di rete: ' + err;
          messageDiv.className = 'message error';
          messageDiv.style.display = 'block';
          logsDiv.style.display = 'none';
          card.classList.add('shake');
          setTimeout(()=>card.classList.remove('shake'),370);
      } finally {
          button.classList.remove('loading');
          form.reset();
      }
    });
  </script>
</body>
</html>
